# Credentials come from the environment (.env locally, docker-compose in containers).
# Targets:
#   dev       DuckDB file; reads the Iceberg lake through the REST catalog (default)
#   ci        DuckDB in memory; attaches a small fixture DB as `lake` (no MinIO needed)
#   bigquery  optional free-tier target (needs `uv add dbt-bigquery` and a service account)
basmati:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      # Full history is ~60M rows. DuckDB defaults to 80% of RAM per connection, and with
      # 4 dbt threads in the 8 GB Docker VM the kernel OOM-killed the build. Cap memory
      # (DuckDB spills to disk past it) and run two models at a time.
      threads: 2
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '3GB') }}"
        preserve_insertion_order: false
      extensions: [httpfs, iceberg]
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ROOT_USER') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
          endpoint: "{{ env_var('DUCKDB_S3_ENDPOINT', 'localhost:9000') }}"
          url_style: path
          use_ssl: false
          region: us-east-1
      attach:
        - path: warehouse
          alias: lake
          type: iceberg
          options:
            endpoint: "{{ env_var('DUCKDB_ICEBERG_ENDPOINT', 'http://localhost:8181') }}"
            authorization_type: none

    # Daily GitHub Actions refresh (src/basmati/lite.py): the warehouse file persists in S3,
    # and a DuckDB "lite lake" (rice + basmati rows) is attached as `lake` instead of Iceberg.
    lite:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse_lite.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '3GB') }}"
        preserve_insertion_order: false
      attach:
        - path: "{{ env_var('LITE_LAKE', '../data/lite_lake.duckdb') }}"
          alias: lake
          read_only: true

    ci:
      type: duckdb
      path: ":memory:"
      threads: 4
      attach:
        - path: "{{ env_var('DBT_FIXTURE_DB', 'fixtures/lake_fixture.duckdb') }}"
          alias: lake
          read_only: true

    bigquery:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      project: "{{ env_var('GCP_PROJECT', '') }}"
      dataset: basmati
      location: asia-south1
      threads: 4
