[project]
name = "basmati-lakehouse"
version = "0.1.0"
description = "Batch lakehouse for Indian mandi prices: basmati prices vs. export policy (MEP) changes."
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests[socks]>=2.32",
    "boto3>=1.40",
]

# Dependency groups (PEP 735): installed for local dev and CI, never shipped as package deps.
# `uv sync` installs all of them (see default-groups below).
[dependency-groups]
spark = ["pyspark==4.1.4"]  # 4.1.x: Iceberg 1.12.0 ships Spark runtimes for 4.0/4.1 only
dbt = ["dbt-core>=1.12,<1.13", "dbt-duckdb>=1.11,<1.12", "duckdb==1.5.6"]
quality = ["great-expectations>=1.24,<2"]
dashboard = ["streamlit>=1.66,<2"]
dev = ["pytest>=9.1", "ruff>=0.17"]
llm = [
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basmati"]

[tool.uv]
default-groups = "all"
# Supply-chain cooldown: resolve as if it were this date, so nothing published in the
# last ~2 weeks can enter uv.lock. Move it forward deliberately when upgrading.
exclude-newer = "2026-10-30T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify, S bandit (security)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
